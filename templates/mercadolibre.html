<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATC | Verificador Mercado Libre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.3s ease; 
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .flash-success { background-color: #f59e0b !important; }
        .flash-error { background-color: #dc2626 !important; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body id="mainBody" class="bg-gradient-to-br from-slate-800 to-yellow-900 min-h-screen flex flex-col items-center justify-center p-3 sm:p-4">

    <div id="wakeLockIndicator" class="absolute top-2 right-2 text-white/50 text-xs flex items-center gap-1 hidden">
        <i class="fas fa-sun"></i> Pantalla Activa
    </div>

    <div class="glass w-full max-w-md p-5 sm:p-8 rounded-2xl shadow-2xl z-10">
        <div class="text-center mb-5">
            <div class="bg-yellow-500 w-14 h-14 sm:w-16 sm:h-16 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg relative">
                <i class="fas fa-box-open text-white text-xl sm:text-2xl"></i>
                <span id="scanCountBadge" class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded-full shadow border-2 border-white">0</span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">Mercado Libre</h2>
            
            <div class="flex justify-center mt-3">
                <button id="modeToggleBtn" onclick="toggleMode()" class="flex items-center gap-2 bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full text-sm font-semibold transition-all border border-yellow-300 hover:bg-yellow-200 focus:outline-none">
                    <i class="fas fa-bolt" id="modeIcon"></i>
                    <span id="modeText">Modo Automático</span>
                </button>
            </div>
        </div>
        
        <div class="space-y-4">
            <div class="relative">
                <label class="text-xs font-semibold text-yellow-600 uppercase tracking-wider ml-1">1. Orden de Venta (SO)</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-hashtag text-gray-400"></i>
                    </div>
                    <input type="text" id="order_name" autocomplete="off" inputmode="none"
                        class="block w-full pl-10 pr-10 py-3 border-gray-200 border rounded-xl focus:ring-2 focus:ring-yellow-500 outline-none transition-all text-gray-700 text-sm sm:text-base font-bold" 
                        placeholder="Escanee Orden...">
                    <button onclick="clearInput('order_name')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500 focus:outline-none transition-colors">
                        <i class="fas fa-times-circle text-lg"></i>
                    </button>
                </div>
            </div>

            <div class="relative">
                <label class="text-xs font-semibold text-yellow-600 uppercase tracking-wider ml-1">2. Meli Shipping ID</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-shipping-fast text-gray-400"></i>
                    </div>
                    <input type="text" id="shipping_id" autocomplete="off" inputmode="none"
                        class="block w-full pl-10 pr-10 py-3 border-gray-200 border rounded-xl focus:ring-2 focus:ring-yellow-500 outline-none transition-all text-gray-700 text-sm sm:text-base font-bold" 
                        placeholder="Escanee Shipping ID...">
                    <button onclick="clearInput('shipping_id')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500 focus:outline-none transition-colors">
                        <i class="fas fa-times-circle text-lg"></i>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button onclick="checkData()" id="verifyBtn"
                    class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 sm:py-4 rounded-xl shadow-lg transition duration-300 flex items-center justify-center gap-2">
                    <span>Verificar Ahora</span>
                    <i class="fas fa-check-circle"></i>
                </button>
            </div>
            
            <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 shadow-inner">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-gray-500 uppercase">Últimos Escaneos</span>
                    <button onclick="resetHistory()" class="text-xs text-red-400 hover:text-red-600"><i class="fas fa-trash"></i> Limpiar</button>
                </div>
                <ul id="historyList" class="text-xs space-y-1 h-16 overflow-y-auto no-scrollbar text-gray-600">
                    <li class="text-center text-gray-400 italic mt-2">No hay registros aún</li>
                </ul>
            </div>

            <a href="/" class="w-full text-center text-gray-500 hover:text-white transition-colors text-sm font-medium pt-2 flex items-center justify-center gap-2">
                <i class="fas fa-chevron-left text-xs"></i> Volver al menú
            </a>
        </div>
    </div>

<script>
    let wakeLock = null;
    const requestWakeLock = async () => { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); document.getElementById('wakeLockIndicator').classList.remove('hidden'); wakeLock.addEventListener('release', () => document.getElementById('wakeLockIndicator').classList.add('hidden')); } } catch (err) { console.log('Wake Lock error:', err); } };
    document.addEventListener('visibilitychange', () => { if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock(); });
    
    let scanCount = localStorage.getItem('meli_count') ? parseInt(localStorage.getItem('meli_count')) : 0;
    let scanHistory = localStorage.getItem('meli_history') ? JSON.parse(localStorage.getItem('meli_history')) : [];
    
    function updateHistoryUI() { document.getElementById('scanCountBadge').innerText = scanCount; const list = document.getElementById('historyList'); list.innerHTML = ''; if (scanHistory.length === 0) { list.innerHTML = '<li class="text-center text-gray-400 italic mt-2">No hay registros aún</li>'; return; } scanHistory.forEach(item => { const icon = item.status === 'success' ? '<i class="fas fa-check-circle text-green-500"></i>' : '<i class="fas fa-times-circle text-red-500"></i>'; list.innerHTML += `<li class="flex justify-between items-center bg-white p-1 rounded border border-gray-100"><span class="truncate font-mono">${icon} ${item.order}</span><span class="text-[10px] text-gray-400">${item.time}</span></li>`; }); }
    
    function addRecord(order, status) { const timeStr = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }); if (status === 'success') { scanCount++; localStorage.setItem('meli_count', scanCount); } scanHistory.unshift({ order: order, status: status, time: timeStr }); if (scanHistory.length > 3) scanHistory.pop(); localStorage.setItem('meli_history', JSON.stringify(scanHistory)); updateHistoryUI(); }
    
    function resetHistory() { if(confirm("¿Seguro que quieres reiniciar el contador a 0?")) { scanCount = 0; scanHistory = []; localStorage.setItem('meli_count', 0); localStorage.setItem('meli_history', JSON.stringify([])); updateHistoryUI(); } }
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration, vol=0.1) { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration); osc.start(); osc.stop(audioCtx.currentTime + duration); }
    
    const bodyEl = document.getElementById('mainBody');
    const triggerSuccess = () => { playTone(880, 'sine', 0.2, 0.1); setTimeout(() => playTone(1046, 'sine', 0.2, 0.1), 100); if (navigator.vibrate) navigator.vibrate(100); bodyEl.classList.add('flash-success'); setTimeout(() => bodyEl.classList.remove('flash-success'), 300); };
    const triggerError = () => { playTone(150, 'sawtooth', 0.6, 0.5); if (navigator.vibrate) navigator.vibrate([300, 100, 300]); bodyEl.classList.add('flash-error'); setTimeout(() => bodyEl.classList.remove('flash-error'), 400); };
    
    let jumpTimer, verifyTimer;
    let isManualMode = false;
    let isProcessing = false;
    
    function toggleMode() { isManualMode = !isManualMode; const btn = document.getElementById('modeToggleBtn'), icon = document.getElementById('modeIcon'), text = document.getElementById('modeText'); const orderInput = document.getElementById('order_name'), shippingInput = document.getElementById('shipping_id'); if (isManualMode) { btn.className = "flex items-center gap-2 bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-sm font-semibold transition-all border border-orange-300 hover:bg-orange-200 focus:outline-none"; icon.className = "fas fa-keyboard"; text.innerText = 'Modo Manual'; orderInput.setAttribute('inputmode', 'text'); shippingInput.setAttribute('inputmode', 'text'); } else { btn.className = "flex items-center gap-2 bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full text-sm font-semibold transition-all border border-yellow-300 hover:bg-yellow-200 focus:outline-none"; icon.className = "fas fa-bolt"; text.innerText = 'Modo Automático'; orderInput.setAttribute('inputmode', 'none'); shippingInput.setAttribute('inputmode', 'none'); } orderInput.focus(); }
    function clearInput(inputId) { document.getElementById(inputId).value = ''; document.getElementById(inputId).focus(); }
    
    document.addEventListener("DOMContentLoaded", () => { 
        requestWakeLock(); updateHistoryUI(); 
        const orderInput = document.getElementById('order_name'); 
        const shippingInput = document.getElementById('shipping_id'); 
        
        orderInput.addEventListener("input", () => { 
            clearTimeout(jumpTimer); 
            if (!isManualMode && orderInput.value.trim().length > 0 && !isProcessing) { 
                // Aumentado a 300ms para asegurar lectura completa del código
                jumpTimer = setTimeout(() => { if (document.activeElement === orderInput) shippingInput.focus(); }, 300); 
            } 
        }); 
        
        shippingInput.addEventListener("input", () => { 
            clearTimeout(verifyTimer); 
            if (!isManualMode && orderInput.value && shippingInput.value && !isProcessing) { 
                // Aumentado a 300ms para que el Zebra termine de escribir el JSON completo antes de verificar
                verifyTimer = setTimeout(checkData, 300); 
            } 
        }); 
        
        orderInput.addEventListener("keypress", (e) => { if(e.key === "Enter" && !isProcessing) shippingInput.focus(); }); 
        shippingInput.addEventListener("keypress", (e) => { if(e.key === "Enter" && !isProcessing) checkData(); }); 
        orderInput.focus(); 
    });

    async function checkData() {
        if (isProcessing || Swal.isVisible()) return;
        
        clearTimeout(jumpTimer); clearTimeout(verifyTimer);
        const nameInput = document.getElementById('order_name');
        const shippingInput = document.getElementById('shipping_id');
        const verifyBtn = document.getElementById('verifyBtn');

        let shippingIdValue = shippingInput.value.trim();

        if (!nameInput.value || !shippingIdValue) return;

        // Comprobar si el valor es un JSON
        if (shippingIdValue.startsWith('{') && shippingIdValue.endsWith('}')) {
            try {
                const jsonData = JSON.parse(shippingIdValue);
                // Extraer el "id" si existe
                if (typeof jsonData === 'object' && jsonData !== null && jsonData.id) {
                    shippingIdValue = String(jsonData.id); // Forzamos a convertir a texto por si acaso
                }
            } catch (e) {
                console.warn("No se pudo parsear el JSON:", e);
            }
        }

        isProcessing = true;
        verifyBtn.disabled = true; verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando...';
        shippingInput.classList.remove('border-red-500', 'ring-2', 'ring-red-500', 'shake');

        try {
            const response = await fetch('/verify_meli', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    name: nameInput.value, 
                    shipping_id: shippingIdValue 
                })
            });
            const result = await response.json();

            if (result.status === 'success') {
                triggerSuccess();
                addRecord(nameInput.value, 'success');
                Swal.fire({
                    icon: 'success', title: '¡Válido!', text: result.message,
                    confirmButtonColor: '#f59e0b', timer: 500, showConfirmButton: false,
                    didClose: () => { 
                        nameInput.value = ''; shippingInput.value = ''; nameInput.focus(); 
                        isProcessing = false; verifyBtn.disabled = false; verifyBtn.innerHTML = '<span>Verificar Ahora</span> <i class="fas fa-check-circle"></i>'; 
                    }
                });
            } else {
                triggerError();
                addRecord(nameInput.value, 'error');
                shippingInput.classList.add('border-red-500', 'ring-2', 'ring-red-500', 'shake');
                Swal.fire({
                    icon: 'error', title: 'Error', text: result.message,
                    confirmButtonColor: '#ef4444',
                    didClose: () => { 
                        shippingInput.value = ''; shippingInput.focus(); 
                        isProcessing = false; verifyBtn.disabled = false; verifyBtn.innerHTML = '<span>Verificar Ahora</span> <i class="fas fa-check-circle"></i>'; 
                    }
                });
            }
        } catch (error) {
            triggerError();
            Swal.fire({ 
                icon: 'error', title: 'Error de Red', text: 'No se pudo conectar al servidor.', confirmButtonColor: '#ef4444',
                didClose: () => { 
                    nameInput.focus(); isProcessing = false; verifyBtn.disabled = false; verifyBtn.innerHTML = '<span>Verificar Ahora</span> <i class="fas fa-check-circle"></i>'; 
                }
            });
        }
    }
    // --- LÓGICA DE KEEP-ALIVE PARA RENDER ---
    // Envía un pulso invisible al servidor cada 30 segundos para evitar la hibernación.
    setInterval(async () => {
        try {
            // Hacemos una petición simple a la raíz del servidor. No necesita hacer nada,
            // solo mantener la conexión viva.
            await fetch('/'); 
            console.log("Keep-alive ping sent to server at " + new Date().toLocaleTimeString());
        } catch (e) {
            console.warn("Keep-alive ping failed. Server might be down or network issue.", e);
        }
    }, 30000); // 30000 milisegundos = 30 segundos

</script>
</body>
</html>
